<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/styles.css">
    <title>Conversor de Moedas</title>
</head>

<body>
    <h1>Conversor de Moedas</h1>
    <p>Converta valores de forma rápida, simples e segura.</p>
    <img src="" alt="">
    <main>

        <label for="">Converter de:</label>
        <select name="" id="">
            <option value="dolar">U$$ Dolar americano</option>
            <option value="euro">€ Euro</option>
            <option value="bitcoin">₿ Biticoin</option>
            <option value="libra">£ Libra</option>
            <option value="real">R$ Real Brasileiro</option>
        </select>

        <label for="">Converter para:</label>
        <select name="" id="">
            <option value="dolar">U$$ Dolar americano</option>
            <option value="euro">€ Euro</option>
            <option value="bitcoin">₿ Biticoin</option>
            <option value="libra">£ Libra</option>
            <option value="real">R$ Real Brasileiro</option>
        </select>

        <label for="">Valor <input class="input-valeu" placeholder="R$ 1.000,00"></label>
        <button class="content-but">Converter agora</button>
        <section>
            <div class="value-box">
                <img class="value-img" src="" alt="">
                <p class="value-box" id="value-name">Real</p>
                <p class="value-convert">R$ 0,00</p>
            </div>
            <div class="value-box">
                <img class="value-img" src="" alt="">
                <p class="value-box" id="value-name">Real</p>
                <p class="value-convert">R$ 0,00</p>
            </div>
        </section>

    </main>
</body>
<script src=""></script>
</html>
