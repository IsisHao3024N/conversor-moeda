<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/styles.css">
    <title>Conversor de Moedas</title>
</head>

<body>
    <h1>Conversor <span>de Moedas</span></h1>
    <p class="frase">Converta valores de forma rápida, simples e segura.</p>
    <main>
        <img src="assets/3dicons-money-iso-color.png" alt="imagem-3d">
        <div class="conteiner">
            <label for="">Converter de:</label>
            <select name="" id="" >
                <option value="real">R$ Real Brasileiro</option>
            </select>
            <label for="">Converter para:</label>
            <select name="" id="" class="value-select">
                <option value="dolar">U$$ Dolar americano</option>
                <option value="euro">€ Euro</option>
                <option value="bitcoin">₿ Biticoin</option>
            </select>
            <label for="">Valor <input class="input-value" placeholder="R$ 1.000,00"></label>
            <button class="convert-but">Converter agora</button>
            <section>
                <div class="value-box">
                    <img src="assets/brasilia.png" alt="">
                    <p class="value-box">Real</p>
                    <p class="value-convert">R$ 0,00</p>
                </div>
                <div class="value-box">
                    <img class="value-img" src="assets/estados-unidos.png" alt="">
                    <p class="value-box" id="value-name">Dolar</p>
                    <p class="converted-value">R$ 0,00</p>
                </div>
            </section>
        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
